<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --ink:        #111111;
    --paper:      #FFFFFF;
    --stage:      #F4F2EC;

    --orange:     #ff5533;
    --yellow:     #FFE04D;
    --pink:       #FF4FA3;
    --blue:       #4D7CFE;
    --green:      #2BD98F;
    --purple:     #8B5CFF;
    --cyan:       #25D7FF;
    --lime:       #B7F531;
    --red:        #FF2E63;
    --violet:     #C44DFF;
    --phone:      #555;

    --shadow-offset: 6px;
    --border-w: 3px;

    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--stage);
    font-family: var(--font-mono);
    color: var(--ink);
    overflow: hidden;
  }

  ::selection{ background: var(--yellow); }

  /* scrollbars — keep them chunky + on-brand */
  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-track{ background: var(--paper); }
  ::-webkit-scrollbar-thumb{ background: var(--ink); border: 2px solid var(--paper); }

  /* ============================================================
     LAYOUT SHELL
     ============================================================ */
  .app{
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
  }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    background: var(--paper);
    border-right: var(--border-w) solid var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .brand{
    padding: 22px 20px 18px;
    border-bottom: var(--border-w) solid var(--ink);
    flex: 0 0 auto;
  }
  .brand-title{
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand-sub{
    margin-top: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
  }

  .feature-list{
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 18px 16px 24px;
  }

  .section-block + .section-block{ margin-top: 22px; }

  .section-eyebrow{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .section-eyebrow .dot{
    width: 10px; height: 10px;
    border: 2px solid var(--ink);
    background: var(--dot-color, var(--yellow));
    flex: 0 0 auto;
  }

  .feature-card{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: var(--border-w) solid var(--ink);
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--ink);
    padding: 10px 12px;
    margin-bottom: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: transform 60ms ease, box-shadow 60ms ease, background 60ms ease;
  }
  .feature-card:hover{
    transform: translate(-1px, -1px);
    box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0 0 var(--ink);
  }
  .feature-card:active{
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 0 var(--ink);
  }
  .feature-card.is-active{
    background: var(--dot-color, var(--yellow));
    transform: translate(var(--shadow-offset), var(--shadow-offset));
    box-shadow: 0 0 0 0 var(--ink);
  }

  .feature-index{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    background: var(--paper);
  }
  .feature-card.is-active .feature-index{ background: var(--ink); color: var(--paper); }

  .feature-name{ flex: 1 1 auto; line-height: 1.25; }

  .feature-list-empty{
    font-size: 12px;
    color: #888;
    padding: 12px 2px;
    line-height: 1.5;
  }

  /* ---------------- STAGE ---------------- */
  .stage{
    position: relative;
    display: grid;
    grid-template-columns: minmax(160px, 240px) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch;
    gap: 24px;
    min-height: 0;
    padding: 18px 32px 20px;
    background:
      radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--accent, var(--yellow)) 22%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--accent, var(--blue)) 18%, transparent) 0%, transparent 45%),
      var(--stage);
    transition: background 200ms ease;
  }

  /* Title/description rail stays beside the video so the device can
     claim the stage height instead of sitting below a top info row. */
  .stage-info{
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-top: 6px;
    padding-bottom: 58px;
  }
  .stage-info .label{
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #777;
  }
  .stage-info .count{
    font-size: 11px;
    font-weight: 700;
    color: #777;
    white-space: nowrap;
  }
  .stage-caption{
    text-align: left;
    max-width: 240px;
  }
  .stage-caption .title{
    font-family: var(--font-display);
    font-size: 22px;
    line-height: 1.1;
  }
  .stage-caption .desc{
    margin-top: 6px;
    font-size: 12.5px;
    color: #555;
    line-height: 1.5;
  }
  /* Caption re-animates on every feature switch (restarted from JS):
     label → title → desc cascade */
  .stage-caption .label,
  .stage-caption .title,
  .stage-caption .desc{
    animation: captionIn 320ms cubic-bezier(0.22, 0.9, 0.3, 1) both;
  }
  .stage-caption .title{ animation-delay: 70ms; }
  .stage-caption .desc{ animation-delay: 140ms; }
  @keyframes captionIn{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* Video frame — a thin border rather than a thick bezel, so the
     clip itself gets essentially all of the available height and
     none of it is ever covered or cropped. */
  .device{
    position: relative;
    align-self: stretch;
    justify-self: center;
    min-height: 0;
    height: 100%;
    width: auto;
    aspect-ratio: 9 / 19.5;
    max-width: 100%;
    max-height: 100%;
    margin: 0;
    background: var(--phone);
    border: var(--border-w) solid var(--phone);
    border-radius: 16px;
    box-shadow: 8px 8px 0 0 var(--ink);
    overflow: hidden;
  }
  /* Fixed gray header/footer chrome, painted ABOVE the sliding videos so
     the screen scrolls behind them and they never get hidden. */
  .device::before,
  .device::after{
    content: '';
    position: absolute;
    left: 0; right: 0;
    z-index: 3;
    background: var(--phone);
  }
  .device::before{ top: 0; height: 44px; }
  .device::after{ bottom: 0; height: 36px; }

  /* Two stacked screens slide in parallel so the frame is never empty:
     the exiting video leaves from one edge while the next enters from
     the opposite edge, TikTok-style. */
  .device-screen{
    position: absolute;
    left: 0; right: 0;
    top: 44px; bottom: 36px;
    z-index: 0;
    transition: transform 280ms cubic-bezier(0.22, 0.9, 0.3, 1);
  }
  .device-screen video{
    width: 100%; height: 100%;
    /* contain, never cover — no part of the clip is ever cropped */
    object-fit: contain;
    background: var(--phone);
    display: block;
  }
  .placeholder{
    position: absolute;
    left: 0; right: 0;
    top: 44px; bottom: 36px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
  }

  .sound-toggle{
    position: absolute;
    right: 32px;
    bottom: 20px;
    z-index: 2;
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: var(--border-w) solid var(--ink);
    box-shadow: 4px 4px 0 0 var(--ink);
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: transform 60ms ease, box-shadow 60ms ease;
  }
  .sound-toggle:hover{ transform: translate(-1px,-1px); box-shadow: 5px 5px 0 0 var(--ink); }
  .sound-toggle:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 0 var(--ink); }

  @media (max-width: 780px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 34vh 1fr; }
    .sidebar{ border-right: none; border-bottom: var(--border-w) solid var(--ink); }
    .stage{
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 14px 18px 18px;
    }
    .stage-info{
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0 92px 0 0;
    }
    .stage-caption{
      max-width: min(100%, 420px);
    }
    .stage-caption .title{
      font-size: 18px;
    }
    .stage-caption .desc{
      font-size: 11.5px;
      line-height: 1.35;
    }
    .sound-toggle{
      right: 18px;
      bottom: 18px;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============================================================
       SIDEBAR — sections rendered from features.js
       ============================================================ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">FEATURE REEL</div>
      <div class="brand-sub">Pick a feature → watch it play</div>
    </div>
    <nav class="feature-list" id="featureList"></nav>
  </aside>

  <!-- ============================================================
       STAGE — portrait video player
       ============================================================ -->
  <main class="stage" id="stage">
    <div class="stage-info">
      <div class="stage-caption">
        <span class="label" id="sectionLabel">—</span>
        <div class="title" id="captionTitle">&nbsp;</div>
        <div class="desc" id="captionDesc"></div>
      </div>
      <span class="count" id="featureCount"></span>
    </div>

    <div class="device">
      <div class="device-screen" id="screenA">
        <video id="playerA" playsinline webkit-playsinline loop></video>
      </div>
      <div class="device-screen" id="screenB">
        <video id="playerB" playsinline webkit-playsinline loop></video>
      </div>
      <div class="placeholder" id="placeholder">Select a feature<br>from the left to play its clip</div>
    </div>

    <button class="sound-toggle" id="soundToggle" type="button">🔊 Sound on</button>
  </main>

</div>

<script src="features.js"></script>
<script>
  /* Feature sections are loaded from features.js. */

  const FEATURE_DATA = window.FEATURE_DATA || [];

  const listEl        = document.getElementById('featureList');
  const stageEl        = document.getElementById('stage');
  const screenA        = document.getElementById('screenA');
  const screenB        = document.getElementById('screenB');
  const playerA        = document.getElementById('playerA');
  const playerB        = document.getElementById('playerB');
  const placeholderEl  = document.getElementById('placeholder');
  const captionTitle   = document.getElementById('captionTitle');
  const captionDesc    = document.getElementById('captionDesc');
  const sectionLabel   = document.getElementById('sectionLabel');
  const featureCount   = document.getElementById('featureCount');
  const soundToggle    = document.getElementById('soundToggle');

  let flatFeatures = [];
  let activeCard = null;
  let activeIndex = -1;
  let soundOn = true;

  /* Only one screen is "live" (target of controls/selection). The other is
     the standby layer that slides in during swipes, then gets promoted. */
  let liveScreen = screenA,    livePlayer = playerA;
  let standbyScreen = screenB, standbyPlayer = playerB;

  livePlayer.muted = !soundOn;
  liveScreen.style.zIndex = 1;

  function buildSidebar(){
    if(!FEATURE_DATA.length){
      listEl.innerHTML = '<div class="feature-list-empty">No features yet. Add entries to FEATURE_DATA in features.js.</div>';
      return;
    }

    FEATURE_DATA.forEach((section, sIdx) => {
      const block = document.createElement('div');
      block.className = 'section-block';
      block.style.setProperty('--dot-color', section.color || 'var(--yellow)');

      const eyebrow = document.createElement('div');
      eyebrow.className = 'section-eyebrow';
      eyebrow.innerHTML = `<span class="dot"></span><span>${section.section}</span>`;
      block.appendChild(eyebrow);

      section.features.forEach((feature, fIdx) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'feature-card';
        card.style.setProperty('--dot-color', section.color || 'var(--yellow)');
        card.innerHTML = `<span class="feature-index">${fIdx + 1}</span><span class="feature-name">${feature.name}</span>`;

        const flatIndex = flatFeatures.length;
        flatFeatures.push({ ...feature, section: section.section, color: section.color, cardEl: card });

        card.addEventListener('click', () => selectFeature(flatIndex));
        block.appendChild(card);
      });

      listEl.appendChild(block);
    });

    featureCount.textContent = flatFeatures.length + ' clip' + (flatFeatures.length === 1 ? '' : 's');
  }

  /* CSS animations run once on load; forcing 'none' → '' re-triggers them. */
  function restartAnimation(el){
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  function updateStageUI(index, feature){
    if(activeCard) activeCard.classList.remove('is-active');
    feature.cardEl.classList.add('is-active');
    activeCard = feature.cardEl;
    activeIndex = index;

    stageEl.style.setProperty('--accent', feature.color || 'var(--yellow)');
    sectionLabel.textContent = feature.section;
    captionTitle.textContent = feature.name;
    captionDesc.textContent = feature.desc || '';
    restartAnimation(sectionLabel);
    restartAnimation(captionTitle);
    restartAnimation(captionDesc);

    placeholderEl.style.display = 'none';
    liveScreen.style.zIndex = 1;
    standbyScreen.style.zIndex = 0;
  }

  function selectFeature(index){
    const feature = flatFeatures[index];
    if(!feature) return;

    updateStageUI(index, feature);
    livePlayer.style.display = 'block';
    livePlayer.src = 'videos/' + feature.file;
    livePlayer.loop = true;
    livePlayer.currentTime = 0;
    livePlayer.play().catch(() => {
      /* Browsers block unmuted autoplay before any click has
         happened on the page (e.g. the very first clip on load).
         Fall back to muted playback so it still plays instantly,
         and reflect that in the sound toggle. */
      if(!livePlayer.muted){
        livePlayer.muted = true;
        soundOn = false;
        soundToggle.textContent = '🔇 Sound off';
        livePlayer.play().catch(() => {});
      }
    });
  }

  function togglePlayback(){
    if(!flatFeatures.length || activeIndex < 0) return;

    if(livePlayer.paused){
      livePlayer.play().catch(() => {});
    } else {
      livePlayer.pause();
    }
  }

  /* TikTok-style swipe: the live video exits while the standby video
     (preloaded with the next clip) enters from the opposite edge in the
     same motion, so the frame never shows a gap. Keyboard + wheel + touch
     all route here. */
  let swipeLock = false;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function slideToFeature(delta){
    if(swipeLock || !flatFeatures.length || activeIndex < 0) return;

    /* Loop around: last → first, first → last (infinite feed). */
    const count = flatFeatures.length;
    const nextIndex = (activeIndex + delta + count) % count;
    if(nextIndex === activeIndex) return;

    if(reducedMotion){ selectFeature(nextIndex); return; }

    swipeLock = true;
    /* next → live exits up, standby enters from below; previous is the mirror */
    const isNext = delta > 0;
    const exitY = isNext ? '-100%' : '100%';
    const enterY = isNext ? '100%' : '-100%';
    const feature = flatFeatures[nextIndex];

    /* Stage the standby layer off-screen without animating, then slide both. */
    standbyScreen.style.transition = 'none';
    standbyScreen.style.transform = 'translateY(' + enterY + ')';
    standbyPlayer.muted = livePlayer.muted;
    standbyPlayer.src = 'videos/' + feature.file;
    standbyPlayer.loop = true;
    standbyPlayer.currentTime = 0;
    standbyPlayer.play().catch(() => {});

    void standbyScreen.offsetWidth;          /* flush the off-screen position */
    liveScreen.style.transition = '';
    liveScreen.style.transform = 'translateY(' + exitY + ')';
    standbyScreen.style.transition = '';
    standbyScreen.style.transform = 'translateY(0)';

    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      swipeLock = false;
      /* Promote the incoming layer to live; reset both instantly. */
      [liveScreen, standbyScreen] = [standbyScreen, liveScreen];
      [livePlayer, standbyPlayer] = [standbyPlayer, livePlayer];
      liveScreen.style.transition = 'none';
      liveScreen.style.transform = 'translateY(0)';
      standbyScreen.style.transition = 'none';
      standbyScreen.style.transform = 'translateY(0)';
      updateStageUI(nextIndex, feature);
    };

    standbyScreen.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 400);                 /* ponytail: fallback if transitionend never fires */
  }

  function seekBy(seconds){
    if(!flatFeatures.length || activeIndex < 0) return;

    const duration = Number.isFinite(livePlayer.duration) ? livePlayer.duration : null;
    const targetTime = livePlayer.currentTime + seconds;
    livePlayer.currentTime = Math.max(0, duration === null ? targetTime : Math.min(duration, targetTime));
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    livePlayer.muted = !soundOn;
    soundToggle.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
    if(soundOn) livePlayer.play().catch(() => {});
  });

  /* Only surface errors for the visible (live) player — the standby layer
     is off-screen during load and must not flash the placeholder. */
  const onPlayerError = function(){
    if(this !== livePlayer) return;
    if(!livePlayer.currentSrc) return;
    placeholderEl.style.display = 'flex';
    placeholderEl.textContent = 'Couldn\'t find "' + livePlayer.src.split('/').pop() + '" in /videos';
    livePlayer.style.display = 'none';
  };
  playerA.addEventListener('error', onPlayerError);
  playerB.addEventListener('error', onPlayerError);

  /* Wheel → swipe. The sidebar keeps its own native scroll. */
  let wheelLock = false;
  document.addEventListener('wheel', (event) => {
    if(event.target.closest('.sidebar')) return;
    if(wheelLock || Math.abs(event.deltaY) < 20) return;
    wheelLock = true;
    slideToFeature(event.deltaY > 0 ? 1 : -1);
    setTimeout(() => { wheelLock = false; }, 320);
  }, { passive: true });

  /* Touch swipe (mobile) */
  let touchStartY = null;
  document.addEventListener('touchstart', (event) => { touchStartY = event.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if(touchStartY === null) return;
    const deltaY = event.changedTouches[0].clientY - touchStartY;
    if(Math.abs(deltaY) > 40) slideToFeature(deltaY < 0 ? 1 : -1);
    touchStartY = null;
  }, { passive: true });

  document.addEventListener('keydown', (event) => {
    if(!flatFeatures.length || activeIndex < 0) return;

    const key = event.key.toLowerCase();

    if(event.code === 'Space'){
      event.preventDefault();
      togglePlayback();
      return;
    }

    if(event.key === 'ArrowDown' || key === 's'){
      event.preventDefault();
      slideToFeature(1);
      return;
    }

    if(event.key === 'ArrowUp' || key === 'w'){
      event.preventDefault();
      slideToFeature(-1);
      return;
    }

    if(event.key === 'ArrowRight' || key === 'd'){
      event.preventDefault();
      seekBy(1);
      return;
    }

    if(event.key === 'ArrowLeft' || key === 'a'){
      event.preventDefault();
      seekBy(-1);
    }
  });

  buildSidebar();
  if(flatFeatures.length) selectFeature(0);
</script>

</body>
</html>
